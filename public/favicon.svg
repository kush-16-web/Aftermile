<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ef2d2"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7fe5ff"/>
    </linearGradient>
  </defs>

  <!-- Outer Diamond (◈) with Crisp Motorsport Cyan Geometry -->
  <path d="M 32 4 L 60 32 L 32 60 L 4 32 Z" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Concentric Inner Solid Diamond Core -->
  <path d="M 32 18 L 46 32 L 32 46 L 18 32 Z" 
        fill="url(#innerGrad)"/>
</svg>
